name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    name: run
    runs-on: ubuntu-latest  # Runs on a fresh Linux virtual machine

    steps:
    
      - name: Checkout repository code
        uses: actions/checkout@v4
        
      - name: run
        run: |
          chmod +x script.sh
          ./script.sh
